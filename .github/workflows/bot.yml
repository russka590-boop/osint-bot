name: osint-bot

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: osint-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Восстановить базу
        uses: actions/cache/restore@v4
        with:
          path: data
          key: bot-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bot-data-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install maigret

      - name: Запуск бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          MAIGRET_ARGS: "-a"
          MAIGRET_TIMEOUT: "900"
        run: timeout 340m python main.py || true

      - name: Сохранить базу
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: bot-data-${{ github.run_id }}-${{ github.run_attempt }}
